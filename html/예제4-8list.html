<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 목록 예시</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: "Pretendard", sans-serif;
            background: linear-gradient(135deg, #f0fdf4, #eff6ff);
            color: #1f2937;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            background: rgba(255,255,255,0.9);
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 18px 32px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #166534;
        }

        ul {
            padding-left: 1.2rem;
            line-height: 2;
        }

        li {
            padding-left: 8px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>목록(List) 예시</h1>
        <ul>
            <li>HTML은 웹 문서의 구조를 만듭니다.</li>
            <li>CSS는 웹 문서를 예쁘게 꾸며줍니다.</li>
            <li>JavaScript는 동적인 기능을 추가합니다.</li>
            <li>웹 페이지는 문서 구조와 스타일, 동작이 함께 만들어집니다.</li>
        </ul>
    </div>
</body>
</html>
