<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>예제8-6 출력문 (설명 추가)</title>
    <style>
        .desc {
            color: #666;
            font-size: 0.9em;
            margin-left: 8px;
        }
        .info-box {
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 10px 15px;
            margin-top: 20px;
            font-size: 0.9em;
            color: #444;
        }
    </style>
</head>
<body>
    <h1>JavaScript Output</h1>

    <!-- 1. innerHTML 출력 영역 + 설명 -->
    <p>
        <span id="output">outPut2:innerHTML</span>
        <span class="desc">&rarr; innerHTML: 지정한 HTML 요소(id="output") 내부에 내용을 삽입하여 출력합니다.</span>
    </p>

    <script>
        // 2. document.write 출력 + 설명
        document.write("outPut1:write <span class='desc'>&rarr; document.write(): HTML 문서의 스크립트 위치에 직접 문자열을 출력합니다.</span><br><br>"); 

        // 3. innerHTML 내용 지정 (위의 p 태그 내부로 들어감)
        document.getElementById("output").innerHTML = "outPut2:innerHTML"; 

        // 4. window.alert 팝업 실행
        window.alert("outPut3:alert"); 

        // 5. console.log 출력
        console.log("outPut4:console"); 
    </script>

    <!-- 3 & 4. 화면상에 보이지 않는 alert와 console.log에 대한 안내 -->
    <div class="info-box">
        <p>💡 <b>화면에 바로 보이지 않는 출력 방식 안내:</b></p>
        <ul>
            <li><b>outPut3:alert</b> &rarr; 페이지 로드 시 팝업 창(경고창)으로 출력이 진행됩니다.</li>
            <li><b>outPut4:console</b> &rarr; 브라우저 개발자 도구(F12)의 <b>[Console]</b> 탭에서 출력 결과를 확인할 수 있습니다.</li>
        </ul>
    </div>
</body>
</html>
