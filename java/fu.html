<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>JavaScript 함수 예제</title>
</head>
<body>
	<h1>JavaScript 함수</h1>

	<h2>1. 이벤트 함수</h2>
	<p>버튼을 클릭하면 연결된 함수가 실행됩니다.</p>
	<pre><code>&lt;button onclick="showMessage()"&gt;실행&lt;/button&gt;</code></pre>
	<button type="button" onclick="showMessage()">실행</button>
	<p id="eventResult"></p>

	<hr>

	<h2>2. 함수로 두 수 더하기</h2>
	<p>함수에 두 값을 전달하고, 계산 결과를 돌려받습니다.</p>
	<pre><code>function add(a, b) {
	return a + b;
}</code></pre>
	<label>첫 번째 수: <input type="number" id="numberA" value="3"></label>
	<label>두 번째 수: <input type="number" id="numberB" value="5"></label>
	<button type="button" onclick="calculateSum()">더하기</button>
	<p id="sumResult"></p>

	<hr>

	<h2>3. 내장 함수</h2>
	<p><code>prompt</code>는 입력 창, <code>confirm</code>은 확인 창, <code>alert</code>은 알림 창을 엽니다.</p>
	<button type="button" onclick="usePrompt()">prompt</button>
	<button type="button" onclick="useConfirm()">confirm</button>
	<button type="button" onclick="useAlert()">alert</button>
	<p id="builtInResult"></p>

	<script>
		function showMessage() {
			document.getElementById("eventResult").textContent = "버튼 클릭 이벤트로 함수가 실행되었습니다.";
		}

		function add(a, b) {
			return a + b;
		}

		function calculateSum() {
			var a = Number(document.getElementById("numberA").value);
			var b = Number(document.getElementById("numberB").value);
			document.getElementById("sumResult").textContent = "합계: " + add(a, b);
		}

		function usePrompt() {
			var answer = prompt("이름을 입력하세요.");
			var message = answer === null ? "입력을 취소했습니다." : "입력한 이름: " + answer;
			document.getElementById("builtInResult").textContent = message;
		}

		function useConfirm() {
			var answer = confirm("계속 진행할까요?");
			document.getElementById("builtInResult").textContent = answer ? "확인을 선택했습니다." : "취소를 선택했습니다.";
		}

		function useAlert() {
			alert("알림 창입니다.");
		}
	</script>
</body>
</html>
