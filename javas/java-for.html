```html
<html>
<head>
    <title>예제 8-17 2차원 for 문</title>
</head>
<body>
    <h3>2차원 for를 이용한 구구단 (18단까지)</h3>

    <table border="2">
    <script>
        // 바깥 for문: 1~18까지 반복
        for (var x = 1; x <= 18; x++) {
            document.write("<tr>");
            document.write("<td>" + x + "단" + "</td>");

            // 안쪽 for문: 2~9까지 반복
            for (var y = 2; y <= 9; y++) {
                document.write("<td>" + x * y + "</td>");
            }

            document.write("</tr>");
        }
    </script>
    </table>
</body>
</html>
```
